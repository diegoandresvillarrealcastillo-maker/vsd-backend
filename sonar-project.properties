# La clave del proyecto y la organizacion las pone el CI (variables SONAR_PROJECT_KEY y
# SONAR_ORGANIZATION de GitHub). SCRUM-277.
sonar.projectName=VSD Health Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,prisma
sonar.tests=src,scripts

sonar.test.inclusions=**/*.spec.ts,**/*.spec.mjs,**/*.spec.mts
# Las migraciones son SQL de PostgreSQL y Sonar las lee con el analizador de PL/SQL: solo da avisos
# que no vienen al caso. Se siguen revisando en el CI con las pruebas contra PostgreSQL.
sonar.exclusions=**/*.spec.ts,**/*.spec.mjs,**/*.spec.mts,**/node_modules/**,**/coverage/**,**/dist/**,prisma/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/pruebas/**,scripts/carga/**,prisma/**

# Avisos que se ignoran a proposito (SCRUM-277, SCRUM-281). Cada uno se reviso en el codigo y no es un
# defecto; ignorarlos deja la nota reflejando el codigo real. Los secretos de verdad los cubre el job
# "Escaneo de secretos" (gitleaks). Si se escribe un caso nuevo de estos en otro archivo, Sonar lo avisara.
#  - secrets:S6698 y yaml:S2068: las contrasenas de las bases desechables del CI, de docker compose y
#    del laboratorio de carga (scripts/carga), que no se parecen a ninguna clave real.
#  - typescript:S2699: pruebas cuya comprobacion esta en supertest o en un contrato compartido, que Sonar no
#    reconoce como aserciones.
#  - typescript:S2871: se ordenan fechas AAAA-MM-DD (el orden de texto es el del calendario), nombres de
#    migraciones, las letras de una palabra para compararla con otra y claves en pruebas: texto simple en
#    el que el orden por defecto es el correcto. localeCompare solo importa con nombres con tildes.
#  - typescript:S5332: las direcciones http:// de LectorDeSvg son nombres de espacios de nombres de XML
#    (Inkscape, RDF...). Se comparan como texto; nunca se abre una conexion.
#  - javascript:S4036: los scripts de scripts/ llaman a git y npm. Los corre una persona en su equipo o
#    el CI, no el servidor ni un usuario.
#  - jssecurity:S8706: dar-acceso-a-vsd-app y revisar-base reciben la conexion a la base de quien los
#    corre a mano; la regla supone un agente de IA que les pasa los argumentos y aqui no lo hay.
#  - typescript:S8786 y S5852: expresiones regulares con peor caso lento. VerificadorDeIdentidad y
#    environment solo quitan la barra final de una URL de la configuracion (nuestra). SvgDeMascota si
#    recibe el SVG que sube una persona, pero cada valor tiene tope (5.000 caracteres, 2.000 las
#    transformaciones) y se midio con textos hostiles de ese tamano: el peor caso fue de 35 ms.
#    src/pruebas son comprobaciones de contenido con texto propio.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=src/domain/model/svg/LectorDeSvg.ts
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e6.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e7.ruleKey=jssecurity:S8706
sonar.issue.ignore.multicriteria.e7.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e8.resourceKey=src/domain/model/svg/SvgDeMascota.ts
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e9.resourceKey=src/infrastructure/auth/VerificadorDeIdentidad.ts
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e10.resourceKey=src/infrastructure/config/environment.ts
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e11.resourceKey=src/pruebas/**
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S5852
sonar.issue.ignore.multicriteria.e12.resourceKey=src/domain/model/svg/SvgDeMascota.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
