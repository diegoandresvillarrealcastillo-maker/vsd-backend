# La clave del proyecto y la organizacion las pone el CI (variables SONAR_PROJECT_KEY y
# SONAR_ORGANIZATION de GitHub). SCRUM-277.
sonar.projectName=VSD Health Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,prisma
sonar.tests=src,scripts

sonar.test.inclusions=**/*.spec.ts,**/*.spec.mjs,**/*.spec.mts
sonar.exclusions=**/*.spec.ts,**/*.spec.mjs,**/*.spec.mts,**/node_modules/**,**/coverage/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/pruebas/**,scripts/carga/**,prisma/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
