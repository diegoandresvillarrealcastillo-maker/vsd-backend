# ============================================================
#  VSD Health - Integracion continua
# ============================================================
#  Primera barrera automatica del proyecto. En este ciclo cubre
#  dos cosas que no dependen de que exista codigo de aplicacion:
#
#    1. que no entre ningun secreto al repositorio;
#    2. que todo commit siga Conventional Commits y cite su ticket.
#
#  Los trabajos de lint, pruebas y construccion se anaden en los
#  ciclos que introducen el codigo correspondiente.
# ============================================================

name: CI

on:
  # Cualquier Pull Request, sin filtrar por rama destino.
  #
  # Filtrarlo a las tres ramas fijas dejaba sin CI a los Pull Request apilados,
  # los que salen de otra rama de trabajo porque dependen de ella. Y el sitio
  # donde eso se nota es el peor: un Pull Request que aparece sin una sola
  # comprobacion se lee como si no hubiera nada que comprobar.
  pull_request:
  push:
    branches: [desarrollo, preproduccion, produccion]

# Principio de minimo privilegio: el CI solo necesita leer el codigo.
permissions:
  contents: read

# Si se empuja dos veces seguidas, la ejecucion anterior se cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  COMMITLINT_VERSION: '21.2.2'

jobs:
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo con el historial completo
        uses: actions/checkout@v7
        with:
          # Gitleaks revisa todos los commits, no solo el ultimo:
          # un secreto borrado despues sigue estando en el historial.
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location "$url" --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Buscar secretos en todo el historial
        # --redact evita que el secreto encontrado quede impreso en el
        # registro del trabajo, que seria una segunda filtracion.
        # --config explicito en vez de confiar en la deteccion automatica:
        # si el archivo se moviera o se renombrara, se prefiere que el trabajo
        # falle a que escanee con las reglas por defecto sin avisar.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  commits:
    name: Convencion de commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Descargar el codigo con el historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalar commitlint
        run: |
          npm install --no-save --no-audit --no-fund \
            "@commitlint/cli@${COMMITLINT_VERSION}" \
            "@commitlint/config-conventional@${COMMITLINT_VERSION}"

      - name: Validar los mensajes de commit del Pull Request
        env:
          # Se pasan por variable de entorno y no interpoladas dentro del
          # script, para no inyectar contenido del evento en la shell.
          COMMIT_DESDE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HASTA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$COMMIT_DESDE" --to "$COMMIT_HASTA" --verbose

  calidad:
    name: Calidad del codigo
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Comprobar si el repositorio ya tiene proyecto de Node
        id: proyecto
        # vsd-frontend todavia no tiene package.json: el trabajo se salta en
        # lugar de fallar, y empezara a ejecutarse solo cuando exista.
        run: |
          if [ -f package.json ]; then
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
            echo "Sin package.json todavia: no hay nada que comprobar."
          fi

      - name: Preparar Node
        if: steps.proyecto.outputs.existe == 'si'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        if: steps.proyecto.outputs.existe == 'si'
        # npm ci respeta package-lock.json al pie de la letra: el CI instala
        # exactamente las mismas versiones que hay en el equipo.
        run: npm ci

      - name: Revisar el estilo y las fronteras de la arquitectura
        if: steps.proyecto.outputs.existe == 'si'
        run: npm run lint

      - name: Revisar el formato
        if: steps.proyecto.outputs.existe == 'si'
        run: npm run format:check

      - name: Revisar los tipos
        if: steps.proyecto.outputs.existe == 'si'
        run: npm run typecheck

      - name: Ejecutar las pruebas con cobertura
        if: steps.proyecto.outputs.existe == 'si'
        # Falla si domain/ o application/ bajan del 80 %.
        run: npm run test:coverage

      - name: Compilar
        if: steps.proyecto.outputs.existe == 'si'
        run: npm run build

  integracion:
    name: Pruebas contra PostgreSQL
    runs-on: ubuntu-24.04

    # Misma version que en local y la misma que corre Supabase. Una base de
    # otra version en el CI convierte cualquier fallo en una discusion sobre
    # si el problema es del codigo o del entorno.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: vsd
          # Credenciales de un contenedor que vive doce minutos, no sale de la
          # maquina del trabajo y no contiene informacion de nadie. Las de
          # verdad viven en los secretos del repositorio y nunca en este
          # archivo.
          POSTGRES_PASSWORD: vsd_ci
          POSTGRES_DB: vsd_health
        ports:
          - 5432:5432
        # Sin esto, el trabajo sigue en cuanto el contenedor arranca, que es
        # antes de que la base acepte conexiones, y la migracion falla sin
        # motivo aparente.
        options: >-
          --health-cmd "pg_isready -U vsd -d vsd_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Comprobar si el repositorio ya tiene proyecto de Node
        id: proyecto
        run: |
          if [ -f package.json ]; then
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
            echo "Sin package.json todavia: no hay nada que comprobar."
          fi

      - name: Preparar Node
        if: steps.proyecto.outputs.existe == 'si'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        if: steps.proyecto.outputs.existe == 'si'
        run: npm ci

      - name: Aplicar las migraciones desde cero
        if: steps.proyecto.outputs.existe == 'si'
        # La base parte vacia en cada ejecucion, asi que esto ejercita tambien
        # que las migraciones se apliquen limpias: tablas, restricciones,
        # roles y politicas de aislamiento.
        env:
          DIRECT_URL: postgresql://vsd:vsd_ci@localhost:5432/vsd_health?schema=public
        run: npx prisma migrate deploy

      - name: Ejecutar las pruebas de integracion
        if: steps.proyecto.outputs.existe == 'si'
        # Solo las que necesitan la base. El resto de la suite ya corrio en
        # "Calidad del codigo", y repetirla aqui alargaria cada Pull Request
        # sin comprobar nada nuevo.
        #
        # Si este trabajo se quedara sin base, las pruebas se saltarian solas y
        # nadie se enteraria. PRUEBAS_DE_INTEGRACION se lo prohibe: aqui, y solo
        # aqui, saltarselas es un error en vez de un salto silencioso.
        env:
          DATABASE_URL: postgresql://vsd:vsd_ci@localhost:5432/vsd_health?schema=public
          PRUEBAS_DE_INTEGRACION: obligatorias
        run: npm run test:integracion

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Construir la imagen
        # La misma que va a desplegar Render (ADR 0018). Si el Dockerfile deja de
        # compilar, se entera el Pull Request y no el dia de la entrega.
        run: docker build --tag vsd-api:ci .

      - name: Imprimir el peso y revisar que no se haya disparado
        run: |
          set -euo pipefail
          bytes="$(docker image inspect vsd-api:ci --format '{{.Size}}')"
          mb=$((bytes / 1024 / 1024))
          echo "La imagen pesa ${mb} MB."
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' vsd-api:ci | cut -c1-140
          # No es una meta: es una alarma contra accidentes (copiar node_modules
          # de desarrollo, dos veces dist). La primera ejecucion en el CI dio
          # 355 MB (la base de Node ~155, node_modules ~133); el margen deja
          # crecer a las dependencias, pero no cabe lo que no debia entrar.
          limite=450
          if [ "$mb" -gt "$limite" ]; then
            echo "::error::La imagen pesa ${mb} MB y el limite de alarma es ${limite} MB."
            exit 1
          fi

      - name: Arrancarla y esperar a que este sana
        run: |
          set -euo pipefail
          # development y no production: aqui se quiere ver que arranca. Que
          # production sin configurar se niega a arrancar se comprueba mas abajo.
          docker run --detach --name api --publish 3000:3000 \
            --env NODE_ENV=development \
            --env CORS_ORIGIN=http://localhost:5173 \
            --env SUPABASE_URL=https://ejemplo.supabase.co \
            vsd-api:ci

          # Esperar al HEALTHCHECK de la imagen comprueba tambien que ese
          # comando funciona, que es algo que de otro modo nadie ejecuta.
          for intento in $(seq 1 24); do
            estado="$(docker inspect --format '{{.State.Health.Status}}' api)"
            echo "intento ${intento}: ${estado}"
            if [ "$estado" = "healthy" ]; then
              break
            fi
            sleep 5
          done

          if [ "$estado" != "healthy" ]; then
            docker logs api
            echo "::error::La imagen no llego a estado healthy."
            exit 1
          fi

          curl --silent --show-error --fail http://localhost:3000/health
          echo

      - name: Revisar la imagen por dentro
        run: |
          set -euo pipefail

          usuario="$(docker exec api id -u)"
          echo "Corre con el usuario ${usuario}"
          test "$usuario" != "0"

          # Nada de configuracion ni de herramientas de desarrollo.
          docker exec api sh -c 'test ! -e /app/.env'
          docker exec api sh -c 'test ! -d /app/node_modules/prisma'
          docker exec api sh -c 'test ! -d /app/node_modules/typescript'
          docker exec api sh -c 'test ! -d /app/src'

          # El codigo es de solo lectura para quien corre el proceso.
          if docker exec api sh -c 'touch /app/dist/escribir-aqui 2>/dev/null'; then
            echo "::error::El proceso pudo escribir dentro de /app/dist."
            exit 1
          fi

      - name: Comprobar que sin configurar se niega a arrancar
        run: |
          set -uo pipefail
          # Por omision la imagen es production, que exige la base de datos y la
          # clave de servicio. Si arrancara igual, arrancaria en memoria y
          # perderia los datos al reiniciarse.
          if docker run --rm vsd-api:ci > salida.txt 2>&1; then
            cat salida.txt
            echo "::error::Sin configuracion debio negarse a arrancar y arranco."
            exit 1
          fi
          grep -q "CORS_ORIGIN" salida.txt
          grep -q "SUPABASE_URL" salida.txt

      - name: Registros del contenedor si algo fallo
        if: failure()
        run: docker logs api || true
