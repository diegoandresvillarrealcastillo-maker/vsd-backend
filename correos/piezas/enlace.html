<!--
  La pieza de los correos que llevan un enlace: el boton y, escrito, el mismo
  enlace por si el boton no funciona (SCRUM-171). Va donde la plantilla maestra
  tiene %%accion%%. Los marcadores se reemplazan junto con los de la plantilla.
-->
                <!-- El boton: grande (52 px de alto, por encima de los 44 que piden los
                     dedos), de esquinas redondas y de ancho completo en el celular.
                     Padding en la celda ademas de en el enlace: Outlook de escritorio
                     ignora el del enlace, y el color va en los dos porque al pasar el
                     cursor solo cambia el del enlace. -->
                <table
                  role="presentation"
                  class="boton-tabla"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin: 12px 0 28px 0"
                >
                  <tr>
                    <td
                      class="boton"
                      align="center"
                      bgcolor="%%claro.boton%%"
                      style="background-color: %%claro.boton%%; border-radius: 9999px; mso-padding-alt: 16px 36px"
                    >
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        class="boton-texto"
                        style="display: inline-block; padding: 16px 36px; background-color: %%claro.boton%%; font-family: %%fuente%%; font-size: 17px; line-height: 20px; font-weight: 700; color: %%claro.sobre_boton%%; text-decoration: none; border-radius: 9999px"
                      >
                        %%boton%%
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  class="suave"
                  style="margin: 0 0 6px 0; font-family: %%fuente%%; font-size: 14px; line-height: 22px; color: %%claro.suave%%"
                >
                  Si el botón no funciona, copia y pega este enlace en tu navegador:
                </p>
                <p
                  style="margin: 0 0 28px 0; font-family: %%fuente%%; font-size: 14px; line-height: 22px; word-break: break-all"
                >
                  <a
                    href="{{ .ConfirmationURL }}"
                    target="_blank"
                    class="enlace"
                    style="color: %%claro.enlace%%; text-decoration: underline"
                    >{{ .ConfirmationURL }}</a
                  >
                </p>
